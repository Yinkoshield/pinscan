<svg xmlns="http://www.w3.org/2000/svg" width="420" height="120" viewBox="0 0 420 120" role="img" aria-label="pinscan">
  <!-- Padlock: the key is what pinscan checks. -->
  <g transform="translate(16 14)">
    <path d="M22 44 V30 a24 24 0 0 1 48 0 V44" fill="none" stroke="#f3f4f6" stroke-width="8" stroke-linecap="round"/>
    <rect x="8" y="42" width="76" height="52" rx="10" fill="#f3f4f6"/>
    <!-- SPKI check mark -->
    <path d="M30 68 l11 11 l22 -24" fill="none" stroke="#1f9d78" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="116" y="66" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="-1.5" fill="#f3f4f6">pinscan</text>
  <text x="118" y="96" font-family="-apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" fill="#9ca3af">TLS certificate-pinning posture scanner</text>
</svg>
