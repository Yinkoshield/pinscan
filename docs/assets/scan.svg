<svg xmlns="http://www.w3.org/2000/svg" width="900" height="312" viewBox="0 0 900 312" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
  <defs>
    <clipPath id="w"><rect x="0" y="0" width="900" height="312" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#w)">
    <rect width="900" height="312" fill="#1b1e24"/>
    <rect width="900" height="36" fill="#2a2e36"/>
    <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="40" cy="18" r="6" fill="#febc2e"/>
    <circle cx="60" cy="18" r="6" fill="#28c840"/>
    <text x="450" y="23" text-anchor="middle" fill="#9aa0a6" font-size="12">pinscan scan com.example.bank</text>
  </g>
  <!-- Columns are positioned explicitly (host / verdict / confidence / note) so
       alignment does not depend on whitespace handling in the renderer. -->
  <g fill="#d4d4d4">
    <text x="24" y="68" fill="#7c8591">$ <tspan fill="#e6e6e6">pinscan scan com.example.bank</tspan></text>

    <g font-weight="bold">
      <text x="370" y="104" fill="#4ec9a0">spki</text>
      <text x="370" y="128" fill="#4ec9a0">key-pinned</text>
      <text x="370" y="152" fill="#f2655a">open</text>
      <text x="370" y="176" fill="#f2655a">metadata</text>
      <text x="370" y="200" fill="#f2655a">open</text>
      <text x="370" y="224" fill="#e2b93d">inconclusive</text>
    </g>

    <text x="24" y="104">api.example-bank.com</text>
    <text x="24" y="128">auth.example-bank.com</text>
    <text x="24" y="152">config.example-bank.com</text>
    <text x="24" y="176">push.example-bank.com</text>
    <text x="24" y="200">cdn.analytics-vendor.example</text>
    <text x="24" y="224">telemetry.example-bank.com</text>

    <text x="510" y="104">conf=high</text>
    <text x="510" y="128">conf=medium</text>
    <text x="510" y="152">conf=high</text>
    <text x="510" y="176">conf=high</text>
    <text x="510" y="200">conf=medium</text>
    <text x="510" y="224">conf=low</text>

    <g fill="#f2655a">
      <text x="640" y="152">&lt;- interceptable</text>
      <text x="640" y="176">&lt;- interceptable</text>
      <text x="640" y="200">&lt;- interceptable</text>
    </g>

    <text x="24" y="264">6 host(s): <tspan fill="#f2655a">3 interceptable</tspan>, <tspan fill="#e2b93d">1 inconclusive (not verified)</tspan>, <tspan fill="#4ec9a0">2 hardened</tspan></text>
    <text x="24" y="292" fill="#7c8591">$ <tspan fill="#9aa0a6">█</tspan></text>
  </g>
</svg>
