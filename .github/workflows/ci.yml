name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: go mod verify
      - name: gofmt (the local gate formats; CI refuses unformatted code)
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "unformatted:"; echo "$out"; exit 1; fi
      - name: No build outputs committed
        run: |
          if git ls-files | grep -Ex 'pinscan(\.exe)?|bin/.*|dist/.*'; then
            echo "build output is tracked; remove it"; exit 1
          fi
      - name: Test (race + coverage)
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Selftest (methodology proof)
        run: go run ./cmd/pinscan selftest
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o bin/pinscan ./cmd/pinscan
      - name: Reproducible build (byte-identical)
        run: make repro

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
